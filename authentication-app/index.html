<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Auth App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dot-bg {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            background-color: #121212; /* Deep dark background */
        }
    </style>
</head>
<body class="dot-bg min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <!-- Loading Skeleton (Dark Mode) -->
    <div id="loadingState" class="bg-[#111111] border border-neutral-800 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] w-full max-w-lg p-8 text-center flex flex-col items-center">
        <svg class="animate-spin h-8 w-8 text-white mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-sm text-neutral-400">Verifying session...</p>
    </div>

    <!-- Dashboard Card (Dark Mode) -->
    <div id="dashboardCard" class="hidden bg-[#111111] border border-neutral-800 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] w-full max-w-lg p-8 relative overflow-hidden">
        
        <!-- Header -->
        <div class="border-b border-neutral-800 pb-6 mb-6 flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-semibold tracking-tight text-white">Dashboard</h1>
                <p class="text-sm text-neutral-400 mt-1">You are securely logged in.</p>
            </div>
            <!-- Avatar -->
            <div class="h-12 w-12 bg-neutral-800 rounded-full flex items-center justify-center border border-neutral-700">
                <span id="avatarText" class="text-lg font-bold text-neutral-300">?</span>
            </div>
        </div>

        <!-- User Details Section -->
        <div class="space-y-4 mb-8">
            <div class="bg-neutral-900 p-4 rounded-lg border border-neutral-800">
                <p class="text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-1">Username</p>
                <p id="profileUsername" class="text-base font-medium text-neutral-200">Loading...</p>
            </div>
            
            <div class="bg-neutral-900 p-4 rounded-lg border border-neutral-800">
                <p class="text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-1">Email Address</p>
                <p id="profileEmail" class="text-base font-medium text-neutral-200">Loading...</p>
            </div>

            <div class="bg-neutral-900 p-4 rounded-lg border border-neutral-800">
                <p class="text-xs font-semibold text-neutral-500 uppercase tracking-wider mb-1">Account Role</p>
                <span id="profileRole" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-white text-black mt-1">
                    Loading...
                </span>
            </div>
        </div>

        <!-- Logout Button -->
        <button id="logoutBtn" 
            class="w-full bg-neutral-800 border border-neutral-700 text-neutral-200 rounded-lg px-4 py-2 text-sm font-medium hover:bg-neutral-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#111111] focus:ring-neutral-500 transition-all flex justify-center items-center h-10">
            <span id="logoutText">Log Out</span>
            <svg id="logoutSpinner" class="hidden animate-spin h-5 w-5 text-neutral-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </div>

    <script src="index.js"></script>
</body>
</html>
