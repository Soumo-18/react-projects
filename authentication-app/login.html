<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Auth App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* TLDraw inspired dot grid background */
        .dot-bg {
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 24px 24px;
            background-color: #121212; /* Deep dark background */
        }
    </style>
</head>
<body class="dot-bg min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <!-- Vercel inspired Card (Dark Mode) -->
    <div class="bg-[#111111] border border-neutral-800 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] w-full max-w-md p-8 relative overflow-hidden">
        
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-semibold tracking-tight text-white">Welcome back</h1>
            <p class="text-sm text-neutral-400 mt-2">Enter your credentials to access your account.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <!-- Error/Success Message Container -->
            <div id="messageBox" class="hidden text-sm p-3 rounded-lg font-medium text-center"></div>

            <div>
                <label for="identifier" class="block text-sm font-medium text-neutral-300 mb-1">Username or Email</label>               
                <input type="text" id="identifier" required 
                    class="w-full px-3 py-2 bg-neutral-900 border border-neutral-800 text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-neutral-500 transition-colors text-sm placeholder-neutral-600"
                    placeholder="johndoe or john@example.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-neutral-300 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-3 py-2 bg-neutral-900 border border-neutral-800 text-white rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:border-neutral-500 transition-colors text-sm placeholder-neutral-600">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-white/70 text-black rounded-lg px-4 py-2 text-sm font-medium hover:bg-neutral-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#111111] focus:ring-white transition-all flex justify-center items-center h-10 mt-6">
                <span id="btnText">Log In</span>
                <!-- Loading Spinner -->
                <svg id="btnSpinner" class="hidden animate-spin h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-neutral-400">
            Don't have an account? 
            <a href="register.html" class="font-medium text-white hover:underline">Sign up</a>
        </p>
    </div>

    <script src="login.js"></script>
</body>
</html>
